name: video-analytics

x-service-env: &service-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-analytics}

x-api-env: &api-env
  <<: *service-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-15}
  AUTH_ENABLED: ${AUTH_ENABLED:-1}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  ALLOW_PRIVATE_HOSTS: ${ALLOW_PRIVATE_HOSTS:-mediamtx}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ../services/event-processor
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed-demo:
    build: ../services/event-processor
    command: ["python", "seed.py"]
    environment:
      <<: *service-env
      DEMO_SOURCE_URL: ${DEMO_SOURCE_URL:-rtsp://mediamtx:8554/demo}
      DEMO_STREAM_NAME: ${DEMO_STREAM_NAME:-demo}
      DEMO_TARGET_FPS: ${DEMO_TARGET_FPS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  samples-init:
    build: ../services/ingestion
    command: ["python", "/scripts/fetch_sample.py", "/samples/sample.avi"]
    volumes:
      - ../scripts:/scripts:ro
      - ../samples:/samples
    restart: "no"

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
    restart: unless-stopped

  fake-camera:
    image: jrottenberg/ffmpeg:6.1-alpine
    depends_on:
      samples-init:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
    volumes:
      - ../samples:/samples:ro
    command:
      - "-re"
      - "-stream_loop"
      - "-1"
      - "-i"
      - "/samples/sample.avi"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "ultrafast"
      - "-tune"
      - "zerolatency"
      - "-pix_fmt"
      - "yuv420p"
      - "-f"
      - "rtsp"
      - "-rtsp_transport"
      - "tcp"
      - "rtsp://mediamtx:8554/demo"
    restart: unless-stopped

  ingestion:
    build: ../services/ingestion
    environment:
      <<: *service-env
      MAX_FPS: ${MAX_FPS:-10}
      MAX_STREAM_LEN: ${MAX_STREAM_LEN:-1000}
      RECONNECT_BASE_DELAY: ${RECONNECT_BASE_DELAY:-1}
      RECONNECT_MAX_DELAY: ${RECONNECT_MAX_DELAY:-30}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: ${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp}
      METRICS_PORT: "8001"
    volumes:
      - ../samples:/samples:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ../services/worker
    environment:
      <<: *service-env
      DETECTOR_BACKEND: ${DETECTOR_BACKEND:-onnx}
      MODEL_PATH: ${MODEL_PATH:-/models/yolov5n.onnx}
      MODEL_URL: ${MODEL_URL:-https://github.com/ultralytics/yolov5/releases/download/v7.0/yolov5n.onnx}
      INPUT_SIZE: ${INPUT_SIZE:-640}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.5}
      NMS_THRESHOLD: ${NMS_THRESHOLD:-0.4}
      STALE_THRESHOLD_MS: ${STALE_THRESHOLD_MS:-300}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-3}
      CONSUMER_NAME: ${CONSUMER_NAME:-}
      METRICS_PORT: "8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8002),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  event-processor:
    build: ../services/event-processor
    environment:
      <<: *service-env
      BATCH_SIZE: ${BATCH_SIZE:-10}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-1.0}
      DB_BUFFER_MAX: ${DB_BUFFER_MAX:-2000}
      TRACK_IOU_THRESHOLD: ${TRACK_IOU_THRESHOLD:-0.3}
      TRACK_TTL_SECONDS: ${TRACK_TTL_SECONDS:-5}
      METRICS_PORT: "8003"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8003),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ../services/api
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  grafana-data:
